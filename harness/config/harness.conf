# Single source of parameters for harness/scripts/; copyable to other
# repositories by changing values only.
INTEGRATION_BRANCH="develop"
PRODUCTION_BRANCH="main"
BRANCH_PREFIXES="feature fix hotfix"
WORKTREE_ROOT="../.worktrees"
LINKED_FILES=".env"
# Primary reviewer used by local review.
PRIMARY_REVIEWER="codex"
# Primary reviewer model.
PRIMARY_REVIEWER_MODEL="gpt-5.6-sol"
# Fallback reviewer, enabled only when the primary exhausts its quota.
FALLBACK_REVIEWER="claude"
# Fallback reviewer model.
FALLBACK_REVIEWER_MODEL="opus"

# Autonomous queue routing: OpenAI/Codex is the primary route. The controller
# uses Sol at medium effort and Claude Opus 5 medium as fallback; the worker
# uses Luna at high/xhigh and, if needed, Sonnet 5. For Claude, the plan's
# xhigh effort is explicitly mapped to high (Claude CLI).
AES_CONTROLLER_OPENAI_MODEL="gpt-5.6-sol"
AES_CONTROLLER_OPENAI_EFFORT="medium"
AES_CONTROLLER_ANTHROPIC_MODEL="claude-opus-5"
AES_CONTROLLER_ANTHROPIC_EFFORT="medium"
AES_WORKER_OPENAI_MODEL="gpt-5.6-luna"
AES_WORKER_ANTHROPIC_MODEL="claude-sonnet-5"
AES_WORKER_ANTHROPIC_EFFORT_HIGH="high"
AES_WORKER_ANTHROPIC_EFFORT_XHIGH="high"

# Login of the account represented by AES_QUEUE_TOKEN. Leave empty in the
# seed: every deployment must set and verify it explicitly with `gh api user`;
# do not use GITHUB_ACTOR, which identifies the event author.
AES_TRUSTED_ACTOR=""

# The quota cache is shared by workers and must live outside the checkout.
# In production, configure the Actions runner directory with
# AES_QUOTA_CACHE_*; these seed values are not repository-relative paths.
AES_QUOTA_CACHE_ROOT="/var/lib/aes/quota"
AES_QUOTA_CACHE_PATH="quota.json"
AES_QUOTA_CACHE_TTL_SECONDS="300"
