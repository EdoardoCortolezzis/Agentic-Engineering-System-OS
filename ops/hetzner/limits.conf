# /etc/aes/limits.conf — root-owned job-gate configuration.
# This is the only source beyond code defaults: hooks do not read the job
# environment, which comes from the runner account's `.env`.
# Recognized keys and defaults:
#   AES_HOST_MAX_JOBS=1                 concurrent jobs on the host
#   AES_MIN_FREE_GB=15                  free space threshold for rejection
#   AES_SLOT_WAIT_SECONDS=1800          wait for a slot before rejecting
#   AES_SLOT_POLL_SECONDS=10            interval between attempts
#   AES_STAMP_MAX_AGE_MINUTES=360       age after which a stamp is suspect
#   AES_LOCK_DIR=/run/aes/jobs
#   AES_DISK_CHECK_PATH=/
#   AES_ARCHIVE_DIR=/var/lib/aes/state/archive
#   AES_WORKTREE_MAX_AGE_DAYS=7
#   AES_LEDGER_RETENTION_DAYS=0         0 = do not delete; pruning is manual
AES_HOST_MAX_JOBS=1
AES_MIN_FREE_GB=15
